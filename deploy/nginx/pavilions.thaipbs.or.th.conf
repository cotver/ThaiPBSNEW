# Virtual host for pavilions.thaipbs.or.th only.
#
# DNS points the name to an IP; this Nginx server block selects the name and
# proxies it to port 3008. Other domains must have their own server blocks and
# upstream ports. Do not add "default_server" or change server_name to "_" here.
#
# Required public path (recommended):
#   58.97.53.52:80/443 -> 172.16.202.65:80/443 -> Nginx -> 127.0.0.1:3008
#
# Direct public NAT to 172.16.202.65:3008 bypasses this file, including the
# /admin restriction. Keep TCP 3008 LAN-only at the edge/server firewall.
#
# The existing self-signed certificate is used initially so this named virtual
# host also handles HTTPS instead of falling through to another port-443 site.
# Replace it with a trusted certificate for pavilions.thaipbs.or.th before
# public use (for example, with Certbot after public DNS and NAT are ready).
#
# Install as /etc/nginx/sites-available/pavilions.thaipbs.or.th and enable
# it from /etc/nginx/sites-enabled/. Replace the allow entries below with the
# exact company/VPN client subnet(s) when they are known.

upstream pavilions_nextjs {
    server 127.0.0.1:3008 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name pavilions.thaipbs.or.th;

    ssl_certificate /etc/nginx/self-signed.crt;
    ssl_certificate_key /etc/nginx/self-signed.key;

    access_log /var/log/nginx/pavilions.access.log;
    error_log  /var/log/nginx/pavilions.error.log;

    # Payload CMS supports large media uploads. Adjust this to the largest file
    # the site should accept; do not leave it at Nginx's 1 MB default.
    client_max_body_size 10g;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Covers /admin, /admin/, nested paths, and mixed-case variants.
    location ~* ^/admin(?:/|$) {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://pavilions_nextjs;
    }

    # Payload API/media uploads can be large. Streaming the request avoids
    # writing the complete upload to Nginx temporary storage first.
    location ^~ /api/ {
        proxy_request_buffering off;
        proxy_pass http://pavilions_nextjs;
    }

    location / {
        proxy_pass http://pavilions_nextjs;
    }
}
