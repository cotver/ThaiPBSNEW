# Install this file as:
# /etc/nginx/sites-available/pavilions.thaipbs.or.th
#
# Before enabling it, replace the allow entries below with the exact company
# client subnet(s). The current 172.16.0.0/12 entry permits the full RFC1918
# 172.16.0.0-172.31.255.255 private range.

upstream pavilions_nextjs {
    server 127.0.0.1:3008;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    server_name pavilions.thaipbs.or.th;

    access_log /var/log/nginx/pavilions.access.log;
    error_log  /var/log/nginx/pavilions.error.log;

    # Payload CMS supports large media uploads. Adjust this to the largest file
    # the site should accept; do not leave it at Nginx's 1 MB default.
    client_max_body_size 10g;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Covers /admin, /admin/, nested paths, and mixed-case variants.
    location ~* ^/admin(?:/|$) {
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        allow ::1;
        deny all;

        proxy_pass http://pavilions_nextjs;
    }

    location / {
        proxy_pass http://pavilions_nextjs;
    }
}
